name: CI

# The repository's own gates, run on every change instead of only before a
# release. These are the same commands `.flyto/coding.yaml` declares, so a
# contributor who runs them locally and a run here mean the same thing by
# "verified".
#
# Nothing in this workflow needs a device, a network service, a token or any
# write scope. It reads the checkout, builds the distribution, and checks it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, declared once at the top and again on the job. Nothing here is
# allowed to write to the repository or to mint an identity.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the next version up. A
        # package whose contribution arrives through an entry point has to be
        # importable on both.
        python-version: ['3.11', '3.12']
    steps:
      # Actions are pinned to full commit SHAs. A moving version reference is
      # an unreviewed dependency that can change under a workflow holding a
      # checkout of this repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the check tools
        # The package itself has no runtime dependencies. Everything installed
        # here is a checker, not something the package needs to work.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest build twine flyto-indexer

      - name: Install the build backend
        # The suite builds a wheel with `--no-isolation`, so the backend named
        # in pyproject.toml must be in this interpreter. Python 3.12 ships
        # without setuptools; read the requirement rather than restate it.
        run: |
          python -c "import tomllib; print('\\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['build-system']['requires']))" > "$RUNNER_TEMP/build-requires.txt"
          pip install -r "$RUNNER_TEMP/build-requires.txt"

      - name: Compile
        # `scripts/` carries no tracked sources today. The gate names it so
        # that a script added later is covered from its first commit, and the
        # directory is created first so the command means the same thing in a
        # fresh checkout as it does in a working tree.
        run: |
          mkdir -p scripts
          python -m compileall -q src tests scripts

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Tests
        # The suite needs no device, no network and no flyto-core.
        run: python -m pytest -o pythonpath=src tests -q

      - name: Build the distribution
        run: python -m build

      - name: Check the built distribution
        # Both artefacts are named rather than globbed, so the check cannot
        # pass on a stale file or on a build that produced only one of them.
        run: python -m twine check dist/flyto_modules_vision-0.1.0-py3-none-any.whl dist/flyto_modules_vision-0.1.0.tar.gz

      - name: Strict repository verification
        # The gate that catches an index, a document or an instruction file
        # drifting away from the code. Invoked as the command a contributor
        # runs, so a green run here and a clean local tree mean the same thing.
        run: flyto-index verify . --full-scan --strict --json
