name: Publish to PyPI

# Same shape as flyto-core's: a tag builds, the built wheel is tested as a
# consumer would meet it, and publishing uses Trusted Publishing so no token
# lives in this repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # SLSA provenance signing
      attestations: write  # SLSA provenance attestation storage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        run: pip install dist/*.whl

      - name: It imports where there is no execution engine
        # The property this package is built around: a host installs it for the
        # parsing alone and may have no flyto-core at all. Asserted against the
        # built wheel, in a job that never installs flyto-core.
        run: |
          python -c "
          from flyto_modules_vision import gateway_url, parse
          items = parse([{'kind': 'zone.overview', 'usable': True, 'zone': 'z1'}])
          assert items[0]['zone'] == 'z1', items
          assert gateway_url().startswith('http://127.0.0.1'), gateway_url()
          print('pure import and parse:', items)
          "

      - name: No parameter can name a host
        # The rule this package exists to restore. It is the reason the interim
        # http.get approach was replaced: the gateway address lived in an
        # operator-authored command, so identical rooms needed different
        # workflows. Asserted against the wheel, not the source.
        run: |
          python -c "
          import json, os
          os.environ['FLYTO_VISION_GATEWAY_URL'] = 'http://127.0.0.1:9000'
          from flyto_modules_vision import gateway_url, OBSERVATION_PATH
          assert gateway_url() == 'http://127.0.0.1:9000'
          assert OBSERVATION_PATH.startswith('/'), OBSERVATION_PATH
          print('address is configuration:', gateway_url() + OBSERVATION_PATH)
          "

      - name: A real flyto-core discovers it and can await it
        # The property a unit test cannot show: an installed flyto-core must
        # find this package, register its steps, and be able to await them.
        # flyto-modules-robotics 0.1.0 published a release that failed exactly
        # here while every one of its unit tests passed.
        run: |
          pip install flyto-core
          python -c "
          import asyncio, inspect
          from core.modules.registry.core import ModuleRegistry
          plugins = ModuleRegistry.discover_plugins(force=True)
          assert 'vision' in plugins, plugins
          ids = sorted(m for m in ModuleRegistry._modules if m.startswith('vision.'))
          assert ids == ['vision.observe'], ids
          cls = ModuleRegistry._modules['vision.observe']
          assert inspect.iscoroutinefunction(cls.execute), 'execute must be a coroutine'
          import os; os.environ['FLYTO_VISION_GATEWAY_URL'] = 'http://127.0.0.1:9'
          out = asyncio.run(cls({}, {}).run())
          assert out['evidence'] == [] and out['error'], out
          print('discovered and awaited:', ids)
          "

      - name: Run the suite against the installed package
        run: |
          pip install pytest
          pytest tests/ -q -o addopts=""

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flyto-modules-vision/
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/flyto-modules-vision/
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
